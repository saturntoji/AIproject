# Веса и границы подобраны на валидационной выборке SMS и собственном наборе
# (notebooks/06_risk_calibration.ipynb). Начальные значения из ТЗ: 0.5 / 0.3 / 0.2, S_se по 3 группам, 35 / 70.
# Результат калибровки: Recall мошенничества на уровне «средний и выше» 0.976, безопасных с высоким уровнем 0.1 %.
weights:
  sms: 0.6
  url: 0.2
  social_engineering: 0.3

social_engineering_saturation: 2   # S_se = min(k / 2, 1)

levels:
  medium_from: 25   # 0–24 низкий, 25–69 средний
  high_from: 70     # 70–100 высокий

overrides:
  code_request_min: 70
  sms_and_url_min: 85
  sms_threshold: 0.8
  url_masking_min: 60

url_categories:
  # Запасные значения. Рабочие пороги t1 и t2 берутся из ml/artifacts/url_model_meta.json.
  t1: 0.35
  t2: 0.70

recommendations:
  LOW: "Явных признаков мошенничества нет, но всё равно не сообщайте посторонним коды и данные карты."
  MEDIUM: "Будьте осторожны: не переходите по ссылкам и проверьте информацию у организации по официальному номеру."
  HIGH: "Не переходите по ссылке, не сообщайте коды и данные карты. Свяжитесь с банком по номеру с обратной стороны карты."

disclaimer: "Оценка носит вероятностный характер и не гарантирует безопасность."
