# Начальные значения из задания 13. Калибровка на валидации запланирована на этап 2.
weights:
  sms: 0.5
  url: 0.3
  social_engineering: 0.2

social_engineering_saturation: 3   # S_se = min(k / 3, 1)

levels:
  medium_from: 35   # 0–34 низкий, 35–69 средний
  high_from: 70     # 70–100 высокий

overrides:
  code_request_min: 70
  sms_and_url_min: 85
  sms_threshold: 0.8
  url_masking_min: 60

url_categories:
  t1: 0.35   # SAFE при P_url < t1
  t2: 0.70   # DANGEROUS при P_url >= t2 (совпадает с границей высокого уровня)

# ПРОТОТИП: пока URL-модель не обучена (задание 11), P_url считается как 1 - exp(-сумма весов).
url_heuristic:
  has_ip: 1.2
  has_punycode: 1.2
  mixed_alphabets: 1.2
  brand_lookalike: 1.0
  has_at: 0.9
  is_shortener: 0.8
  suspicious_tld: 0.5
  nonstandard_port: 0.4
  double_slash_in_path: 0.3
  no_https: 0.2
  per_suspicious_word: 0.35
  many_hyphens: 0.3
  many_subdomains: 0.4

recommendations:
  LOW: "Явных признаков мошенничества нет, но всё равно не сообщайте посторонним коды и данные карты."
  MEDIUM: "Будьте осторожны: не переходите по ссылкам и проверьте информацию у организации по официальному номеру."
  HIGH: "Не переходите по ссылке, не сообщайте коды и данные карты. Свяжитесь с банком по номеру с обратной стороны карты."

disclaimer: "Оценка носит вероятностный характер и не гарантирует безопасность."
