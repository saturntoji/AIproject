{% extends "base.html" %}
{% block title %}Вход — SMS Guard{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="panel auth-card">
    <h1>SMS Guard</h1>
    <p class="muted text-center">Защита от SMS-мошенничества</p>
    <label class="form-label" for="username">Логин</label>
    <input class="form-control mb-3" id="username" value="demo_user" autocomplete="off">
    <label class="form-label" for="password">Пароль</label>
    <input class="form-control mb-3" id="password" type="password" value="password" autocomplete="off">
    <a class="btn btn-primary w-100" href="{% url 'dashboard' %}">Войти</a>
    <p class="muted text-center mt-3 mb-0">Нет аккаунта? Зарегистрироваться</p>
    <p class="muted text-center mt-2 mb-0">Макет: вход пока не работает.</p>
  </div>
</div>
{% endblock %}
