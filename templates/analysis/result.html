{% extends "base.html" %}
{% load static %}
{% block title %}Результат проверки — SMS Guard{% endblock %}
{% block content %}
<h1>Результат проверки</h1>
<div id="result"></div>
{{ payload|json_script:"result-data" }}
<form method="post" action="{% url 'delete_check' check.id %}" class="mt-3"
      onsubmit="return confirm('Удалить эту запись?');">
  {% csrf_token %}
  <a class="btn btn-outline-secondary" href="{% url 'history' %}">К истории</a>
  <button class="btn btn-outline-danger" type="submit">Удалить запись</button>
</form>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/result.js' %}?v=5"></script>
<script>
  renderResult(JSON.parse(document.getElementById("result-data").textContent), document.getElementById("result"));
</script>
{% endblock %}
