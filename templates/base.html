{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SMS Guard{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=2">
</head>
<body>
{% block body %}
<div class="app">
  <nav class="sidebar" aria-label="Основное меню">
    <a class="brand" href="{% url 'dashboard' %}">SMS Guard</a>
    <div class="nav-links">
      <a href="{% url 'dashboard' %}" {% if active == 'dashboard' %}class="active" aria-current="page"{% endif %}>Dashboard</a>
      <a href="{% url 'check_sms' %}" {% if active == 'sms' %}class="active" aria-current="page"{% endif %}>Проверка SMS</a>
      <a href="{% url 'check_url' %}" {% if active == 'url' %}class="active" aria-current="page"{% endif %}>Проверка URL</a>
      <a href="{% url 'history' %}" {% if active == 'history' %}class="active" aria-current="page"{% endif %}>История</a>
      <span>Статистика</span>
      <span>Профиль</span>
    </div>
    <a class="logout" href="{% url 'login' %}">Выход</a>
  </nav>
  <main class="content">
    <div class="note">Макет интерфейса. Проверка пока не работает, все данные на экране условные.</div>
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
</body>
</html>
